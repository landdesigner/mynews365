<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>신문 바로가기</title><meta name="theme-color" content="#142b51"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="신문 바로가기"><link rel="apple-touch-icon" href="/apple-touch-icon.png"><link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png"><link rel="manifest" href="/manifest.webmanifest"><style>:root{font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo',sans-serif;color:#152238;background:#f5f7fb}body{margin:0}header{background:#142b51;color:white;padding:27px 18px 20px}h1{font-size:25px;margin:0 0 7px}header p{margin:0;color:#d9e4f4;font-size:13px}.wrap{max-width:900px;margin:auto;padding:16px}input{box-sizing:border-box;width:100%;padding:15px;border:1px solid #ccd5e2;border-radius:12px;font-size:16px;background:white}.tabs{display:flex;gap:8px;overflow:auto;padding:14px 0;scrollbar-width:none}.tabs button{white-space:nowrap;border:1px solid #d5deea;background:white;border-radius:22px;padding:10px 15px;font-size:14px}.tabs button.active{background:#1d4c92;color:white;border-color:#1d4c92}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}@media(min-width:620px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}.tile{display:flex;align-items:center;justify-content:space-between;background:white;border:1px solid #e0e6f0;border-radius:12px;min-height:57px;padding:4px 10px 4px 14px;gap:4px}.tile a{color:#152238;text-decoration:none;font-weight:650;font-size:15px;flex:1;padding:12px 0}.tile a:active{text-decoration:underline}.star{background:none;border:0;color:#bac5d3;font-size:24px;padding:7px;cursor:pointer}.star.on{color:#e5a000}#count{font-size:13px;color:#617087;margin:3px 0 13px}footer{font-size:12px;color:#738095;margin:25px 0;text-align:center;line-height:1.7}</style></head><body><header><div style="max-width:900px;margin:auto"><h1>📰 신문 바로가기</h1><p>신문 이름을 누르면 해당 언론사 사이트로 이동합니다. ☆를 눌러 즐겨찾기하세요.</p></div></header><main class="wrap"><input id="search" type="search" placeholder="신문 이름 검색 (예: 매일경제, 영남일보)" aria-label="신문 검색"><nav class="tabs" id="tabs"></nav><p id="count"></p><section class="grid" id="grid"></section><footer>각 신문사의 공식 사이트로 직접 연결합니다.<br>일부 언론사는 모바일 환경에서 자체적으로 주소를 변경할 수 있습니다.</footer></main><script>
const data={"즐겨찾기":[],"종합·사회":[["조선일보","https://www.chosun.com/"],["중앙일보","https://www.joongang.co.kr/"],["동아일보","https://www.donga.com/"],["한겨레","https://www.hani.co.kr/"],["경향신문","https://www.khan.co.kr/"],["한국일보","https://www.hankookilbo.com/"],["서울신문","https://www.seoul.co.kr/"],["국민일보","https://www.kmib.co.kr/"],["세계일보","https://www.segye.com/"],["문화일보","https://www.munhwa.com/"],["오마이뉴스","https://www.ohmynews.com/"],["프레시안","https://www.pressian.com/"],["노컷뉴스","https://www.nocutnews.co.kr/"],["미디어오늘","https://www.mediatoday.co.kr/"]],"통신·방송":[["연합뉴스","https://www.yna.co.kr/"],["뉴시스","https://www.newsis.com/"],["뉴스1","https://www.news1.kr/"],["YTN","https://www.ytn.co.kr/"],["KBS뉴스","https://news.kbs.co.kr/"],["MBC뉴스","https://imnews.imbc.com/"],["SBS뉴스","https://news.sbs.co.kr/"],["JTBC뉴스","https://news.jtbc.co.kr/"],["연합뉴스TV","https://www.yonhapnewstv.co.kr/"],["TV조선뉴스","https://news.tvchosun.com/"]],"경제·IT":[["매일경제","https://www.mk.co.kr/"],["한국경제","https://www.hankyung.com/"],["머니투데이","https://www.mt.co.kr/"],["서울경제","https://www.sedaily.com/"],["이데일리","https://www.edaily.co.kr/"],["헤럴드경제","https://biz.heraldcorp.com/"],["아시아경제","https://www.asiae.co.kr/"],["파이낸셜뉴스","https://www.fnnews.com/"],["아주경제","https://www.ajunews.com/"],["전자신문","https://www.etnews.com/"],["디지털타임스","https://www.dt.co.kr/"],["ZDNet Korea","https://zdnet.co.kr/"],["이투데이","https://www.etoday.co.kr/"]],"지역신문":[["매일신문","https://www.imaeil.com/"],["영남일보","https://www.yeongnam.com/"],["경북일보","https://www.kyongbuk.co.kr/"],["경북매일","https://www.kbmaeil.com/"],["대구일보","https://www.idaegu.com/"],["부산일보","https://www.busan.com/"],["국제신문","https://www.kookje.co.kr/"],["경남신문","https://www.knnews.co.kr/"],["강원일보","https://www.kwnews.co.kr/"],["경인일보","https://www.kyeongin.com/"],["인천일보","https://www.incheonilbo.com/"],["대전일보","https://www.daejonilbo.com/"],["충청투데이","https://www.cctoday.co.kr/"],["전북일보","https://www.jjan.kr/"],["광주일보","https://www.kwangju.co.kr/"],["제주일보","https://www.jejunews.com/"]],"스포츠":[["스포츠조선","https://sports.chosun.com/"],["스포츠서울","https://www.sportsseoul.com/"],["스포츠경향","https://sports.khan.co.kr/"],["스포츠동아","https://sports.donga.com/"],["일간스포츠","https://isplus.com/"],["스포츠한국","https://sports.hankooki.com/"]],"해외":[["BBC","https://www.bbc.com/news"],["CNN","https://www.cnn.com/"],["Reuters","https://www.reuters.com/"],["AP News","https://apnews.com/"],["The Guardian","https://www.theguardian.com/international"],["New York Times","https://www.nytimes.com/"],["Nikkei Asia","https://asia.nikkei.com/"]]};
let current='전체';let fav;try{fav=new Set(JSON.parse(localStorage.getItem('newsFavorites')||'[]'))}catch(e){fav=new Set()};const all=Object.entries(data).filter(([k])=>k!=='즐겨찾기').flatMap(([cat,items])=>items.map(([name,url])=>({cat,name,url})));const tabs=document.getElementById('tabs'),grid=document.getElementById('grid'),count=document.getElementById('count'),search=document.getElementById('search');function render(){tabs.replaceChildren();['전체','즐겨찾기',...Object.keys(data).filter(x=>x!=='즐겨찾기')].forEach(cat=>{let b=document.createElement('button');b.textContent=cat;b.className=current===cat?'active':'';b.onclick=()=>{current=cat;render()};tabs.append(b)});const q=search.value.trim().toLowerCase();const items=all.filter(x=>(current==='전체'||(current==='즐겨찾기'?fav.has(x.name):x.cat===current))&&x.name.toLowerCase().includes(q));count.textContent=`${items.length}개 신문사`;grid.replaceChildren();items.forEach(x=>{let tile=document.createElement('div');tile.className='tile';let a=document.createElement('a');a.textContent=x.name;a.href=x.url;a.target='_blank';a.rel='noopener noreferrer';let b=document.createElement('button');b.className='star'+(fav.has(x.name)?' on':'');b.textContent=fav.has(x.name)?'★':'☆';b.setAttribute('aria-label',x.name+' 즐겨찾기');b.onclick=()=>{fav.has(x.name)?fav.delete(x.name):fav.add(x.name);try{localStorage.setItem('newsFavorites',JSON.stringify([...fav]))}catch(e){}render()};tile.append(a,b);grid.append(tile)})}search.addEventListener('input',render);render();
if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("/sw.js").catch(()=>{}))}</script></body></html>
