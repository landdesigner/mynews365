if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("/sw.js").catch(()=>{}))}</script><script>(function(){const topics={gumi:'구미시',gyeongbuk:'경상북도',industry:'구미 반도체 로봇 산업',forest:'(구미 OR 경북) (공원 OR 도시숲 OR 녹지)'};let topic='gumi',request=0;const status=document.getElementById('newsStatus'),list=document.getElementById('headlines'),more=document.getElementById('newsMore');function moreUrl(){return 'https://news.google.com/search?q='+encodeURIComponent(topics[topic])+'&hl=ko&gl=KR&ceid=KR%3Ako'}async function load(){const id=++request;status.textContent='최신 기사 불러오는 중…';list.replaceChildren();more.href=moreUrl();try{const response=await fetch('/.netlify/functions/headlines?topic='+encodeURIComponent(topic),{cache:'no-store'});if(!response.ok)throw Error('뉴스 서버 응답 오류');const data=await response.json();if(id!==request)return;if(!Array.isArray(data.items)||!data.items.length)throw Error('기사 없음');const sortedItems=[...data.items].sort((a,b)=>{const ta=Date.parse(a.date),tb=Date.parse(b.date);return (Number.isFinite(tb)?tb:0)-(Number.isFinite(ta)?ta:0)});for(const item of sortedItems){const li=document.createElement('li'),a=document.createElement('a'),meta=document.createElement('span');a.textContent=item.title;a.href=item.link;a.target='_blank';a.rel='noopener noreferrer';meta.className='newsmeta';const d=new Date(item.date);meta.textContent=(item.source||'뉴스')+' · '+(Number.isNaN(d.getTime())?'게시일 미상':new Intl.DateTimeFormat('ko-KR',{timeZone:'Asia/Seoul',month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'}).format(d));li.append(a,meta);list.append(li)}status.textContent='최신 '+data.items.length+'건 · '+new Intl.DateTimeFormat('ko-KR',{timeZone:'Asia/Seoul',hour:'2-digit',minute:'2-digit'}).format(new Date())+' 기준 조회 · 오늘 기사만 표시되는 것은 아닙니다.'}catch(e){if(id!==request)return;status.textContent='현재 자동 뉴스 목록을 불러올 수 없습니다. 아래 「더 많은 뉴스 보기」를 누르면 최신 기사 검색으로 이동합니다.'}}document.getElementById('liveFilters').addEventListener('click
